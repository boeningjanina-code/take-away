  .circle{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none}
  .circle:active,.card:active,.chip:active{transform:scale(.95)}
  svg{display:block}

  /* list */
  .hero{margin:18px 4px 0;font-size:54px;line-height:.95;font-weight:700;letter-spacing:-.045em;color:#fff;text-shadow:0 2px 24px rgba(120,70,100,.35)}
  .hero span{display:block}
  .hero .soft{filter:blur(4px);opacity:.9}
  .hero .ind{padding-left:56px}
  .sync{font-size:12px;color:var(--ink-soft);padding:7px 12px;border-radius:30px;display:inline-block;margin:22px 4px 0}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
  .card{position:relative;height:210px;border-radius:26px;overflow:hidden;text-align:left;border:1px solid rgba(255,255,255,.7);box-shadow:0 14px 30px rgba(120,80,110,.18);transition:transform .15s}
  .card .ph{position:absolute;inset:0;background-size:cover;background-position:center}
  .card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(70,50,70,.30),rgba(70,50,70,0) 48%,rgba(70,50,70,.22))}
  .card .tx{position:absolute;left:14px;right:14px;top:14px;color:#fff;display:flex;flex-direction:column;gap:4px}
  .card .t{font-size:16.5px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;font-weight:600;line-height:1.18;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;text-shadow:0 1px 10px rgba(70,40,60,.3)}
  .card .d{font-size:12px;opacity:.9}
  .card .pill{position:absolute;left:12px;bottom:12px;border-radius:20px;padding:6px 11px;font-size:12.5px;color:#fff;background:rgba(255,255,255,.25)}
  .card.new{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:16px;display:flex;flex-direction:column;justify-content:space-between}
  .card.new b{font-size:17px;font-weight:600}
  .card.new small{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:4px}
  .plusdot{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(200,140,180,.45)}
  .empty-note{grid-column:1/-1;text-align:center;color:#fff;font-size:15px;padding:10px;text-shadow:0 1px 10px rgba(80,40,60,.35)}

  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);width:min(484px,calc(100% - 36px));display:flex;gap:10px;align-items:center;z-index:5}
  .search{flex:1;min-width:0;height:54px;border-radius:30px;display:flex;align-items:center;gap:10px;padding:0 18px;background:rgba(255,255,255,.66)}
  .search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15.5px;color:var(--ink)}
  .search input::placeholder,.adder input::placeholder{color:var(--ink-soft)}
  .dock .circle{width:54px;height:54px;background:rgba(255,255,255,.66)}
  .dock .go{background:var(--accent);color:#fff;border:0;box-shadow:0 8px 20px rgba(200,140,180,.45)}

  /* detail */
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .datepill{border-radius:30px;padding:0 14px;height:44px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);position:relative}
  .datepill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
  .datepill input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
  .title-in{display:block;width:100%;margin:46px 0 0;text-align:center;border:0;background:transparent;outline:none;resize:none;overflow:hidden;color:#fff;font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.2;text-shadow:0 2px 16px rgba(90,50,80,.4);padding:0}
  .title-in::placeholder{color:rgba(255,255,255,.8)}
  .prog{display:flex;gap:10px;align-items:center;margin-top:20px}
  .prog .circle{width:56px;height:56px;background:var(--glass-strong);font-size:13px;font-weight:600}
  .wave{flex:1;height:56px;border-radius:30px;display:flex;align-items:center;gap:3px;padding:0 18px;background:var(--glass-strong);overflow:hidden}
  .wave i{width:3px;border-radius:2px;background:rgba(91,80,110,.25);transition:background .3s}
  .wave i.on{background:#5b5070}
  .wave b{margin-left:auto;padding-left:8px;font-size:13px;font-weight:500;flex:none}
  .meta{text-align:center;font-size:13px;color:#fff;margin-top:10px;text-shadow:0 1px 8px rgba(80,40,60,.4)}
  .sheet{margin-top:20px;border-radius:28px;padding:8px 14px 10px;background:rgba(255,255,255,.76);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.95);box-shadow:0 16px 34px rgba(120,80,110,.16)}
  .sub{font-size:13px;font-weight:600;padding:12px 4px 4px}
  .sub.faint{color:var(--ink-faint);padding-top:16px}
  .item{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid rgba(91,80,110,.09)}
  .item:last-child{border-bottom:0}
  .chk{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid rgba(91,80,110,.32);background:rgba(255,255,255,.6);display:grid;place-items:center;transition:transform .15s}
  .chk:active{transform:scale(.85)}
  .chk svg{opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.3,1.6,.5,1)}
  .item.done .chk{border:0;background:var(--accent);box-shadow:0 4px 10px rgba(200,140,170,.45);color:#fff}
  .item.done .chk svg{opacity:1;transform:scale(1)}
  .item-in{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16.5px;font-weight:500;color:var(--ink);padding:4px 0}
  .item.done .item-in{color:var(--ink-faint);text-decoration:line-through}
  .del{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-faint)}
  .hint{color:var(--ink-soft);font-size:14.5px;padding:8px 4px 12px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:center}
  .chip{border-radius:30px;padding:10px 16px;font-size:14px;transition:transform .15s}
  .chip.danger{color:#b4566e}
  .adder{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);width:min(484px,calc(100% - 36px));display:flex;gap:10px;z-index:5}
  .adder input{flex:1;min-width:0;height:54px;border-radius:30px;padding:0 20px;font-size:16px;outline:none;background:rgba(255,255,255,.74)}
  .adder button{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 20px rgba(200,140,180,.45)}

  /* modal + toast */
  .scrim{position:fixed;inset:0;z-index:20;background:rgba(70,40,60,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:18px}
  .scrim.on{display:flex}
  .modal{width:100%;max-width:440px;border-radius:28px;padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);background:rgba(255,255,255,.85)}
  .modal h3{margin:0 0 6px;font-size:19px}
  .modal p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;line-height:1.45}
  .modal .btns{display:flex;gap:10px}
  .modal .btns button{flex:1;padding:14px;border-radius:18px;font-weight:600;font-size:15px}
  .b-ghost{background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(91,80,110,.12)}
  .b-warn{background:linear-gradient(135deg,#d97a94,#b4566e);color:#fff}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,16px);opacity:0;z-index:30;padding:10px 16px;border-radius:30px;font-size:14px;transition:all .25s;pointer-events:none;white-space:nowrap;background:rgba(255,255,255,.8)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .view{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="app" id="app"></main>
<div id="dock"></div>
<div class="scrim" id="scrim"><div class="modal gl" id="modal"></div></div>
<div class="toast gl" id="toast" role="status"></div>

  const LS_KEY = "mitnehmliste.v1";

  let query = "";
  let col = null, storeMode = "local";
  const dirty = {}, timers = {}, chains = {};

  const $ = (s, el=document) => el.querySelector(s);

  const I = {
    back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',

    search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>'
  };

  // ---------- storage ----------
  function loadLocal(){ try { const r = localStorage.getItem(LS_KEY); if (r) events = JSON.parse(r) || {}; } catch(e){} }
  function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(events)); } catch(e){} }
  function touch(id){
    if (!events[id]) return;
    events[id].updatedAt = Date.now(); saveLocal();
    if (!col) return;
    dirty[id] = true; clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), 500);
  }
  function flush(id){
    delete timers[id];
    chains[id] = (chains[id] || Promise.resolve()).then(async () => {
      try { if (col && events[id]) await col.doc(id).set(JSON.parse(JSON.stringify(events[id]))); }
      catch(e){ writeErr(e); }
      finally { if (!timers[id]) dirty[id] = false; }
    });
  }
  function removeRemote(id){
    clearTimeout(timers[id]); delete timers[id]; delete dirty[id];
    if (!col) return;
    chains[id] = (chains[id] || Promise.resolve()).then(() => col.doc(id).delete().catch(writeErr));
  }
  function writeErr(e){
    if (e && e.code === "quota_exceeded") toast("Speicher voll – lösch ein altes Event");
    else if (e && ["invalid_argument","revoked","not_granted"].includes(e.code)) { col = null; storeMode = "local"; setSync(); }
  }
  async function connect(){
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!d || !u) return;
      const me = await u.id(); if (!me) return;
      col = d.collection("data/users/" + me);
      storeMode = "loading"; setSync();
      const t = setTimeout(() => { if (storeMode === "loading") { storeMode = "offline"; setSync(); } }, 10000);
      let first = true;
      col.onSnapshot(snap => {
        if (!snap.metadata.fromCache) { clearTimeout(t); storeMode = "cloud"; setSync(); }
        const remote = {};
        snap.docs.forEach(x => { const v = x.data(); if (v) remote[x.id] = v; });
        if (first && !snap.metadata.fromCache) {
          first = false;
          Object.keys(events).forEach(k => { if (!remote[k] || (events[k].updatedAt||0) > (remote[k].updatedAt||0)) { dirty[k] = true; flush(k); } });
        }
        let changed = false;
        Object.keys(remote).forEach(k => {
          if (dirty[k]) return;
          const r = remote[k], l = events[k];
          if (!l || (r.updatedAt||0) > (l.updatedAt||0)) { events[k] = JSON.parse(JSON.stringify(r)); changed = true; }
        });
        if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites) {
          Object.keys(events).forEach(k => { if (!remote[k] && !dirty[k] && events[k]._synced) { delete events[k]; changed = true; } });
        }
        Object.keys(remote).forEach(k => { if (events[k]) events[k]._synced = true; });
        if (changed) { saveLocal(); softRender(); }
      }, () => { clearTimeout(t); storeMode = "offline"; setSync(); });
    } catch(e) {}
  }
  function setSync(){
    const el = $("#sync"); if (!el) return;
    const txt = { cloud:"☁︎ auf all deinen Geräten", loading:"lädt …", offline:"offline gespeichert", local:"auf diesem Gerät gespeichert" }[storeMode];
    el.textContent = txt || "";
  }

  // ---------- helpers ----------
  function stats(ev){ const n = (ev.items||[]).length, d = (ev.items||[]).filter(i=>i.done).length; return { n, d, pct: n ? Math.round(d/n*100) : 0 }; }
  function fmtDate(s){ if (!s) return ""; try { return new Date(s + "T12:00:00").toLocaleDateString("de-DE", { weekday:"short", day:"numeric", month:"long" }); } catch(e){ return s; } }
  function sorted(){
    return Object.entries(events).sort(([,a],[,b]) => {
      if (a.date && b.date) return a.date.localeCompare(b.date);
      if (a.date) return -1; if (b.date) return 1;
      return (b.createdAt||0) - (a.createdAt||0);
    });
  }
  function cardBg(ev){ return CARDS[(ev.img ?? 0) % CARDS.length]; }
  function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200); }

  // ---------- render ----------
  function render(){
    if (view.name === "detail" && events[view.id]) renderDetail(); else { view = { name:"list", id:null }; renderList(); }
    setSync();
  }
  function softRender(){
    const a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) { if (view.name === "detail") updateProgress(); else renderGrid(); return; }
    render();
  }

  function renderList(){
    app.innerHTML = `
      <h1 class="hero"><span class="soft">Unterwegs</span><span class="ind">ist alles</span><span class="ind">dabei.</span></h1>
      <span class="sync gl" id="sync"></span>
      <div class="grid view" id="grid"></div>`;
    dock.innerHTML = `<div class="dock">
      <label class="search gl">${I.search}<input id="q" type="search" placeholder="Event suchen …" value="${esc(query)}" aria-label="Event suchen"></label>
      <button class="circle gl go" data-new aria-label="Neues Event">${I.plus}</button>
    </div>`;
    renderGrid();
  }
  function renderGrid(){
    const g = $("#grid"); if (!g) return;
    const q = query.trim().toLowerCase();
    const list = sorted().filter(([,e]) => !q || (e.title||"").toLowerCase().includes(q));
    let html = list.map(([id, ev]) => {
      const s = stats(ev);
      return `<button class="card" data-open="${id}">
        <span class="ph" style="background-image:${cardBg(ev)}"></span><span class="shade"></span>
        <span class="tx"><span class="t">${esc(ev.title || "Unbenanntes Event")}</span>${ev.date ? `<span class="d">${esc(fmtDate(ev.date))}</span>` : ""}</span>
        <span class="pill gl">${s.n ? (s.d === s.n ? "Alles eingepackt" : `${s.d}/${s.n} eingepackt`) : "Noch leer"}</span>
      </button>`;
    }).join("");
    if (q && !list.length) html = `<div class="empty-note">Kein Event gefunden.</div>`;
    if (!q) html += `<button class="card new" data-new><span><b>Neues Event</b><small>${Object.keys(events).length ? "Was steht als Nächstes an?" : "Leg dein erstes Event an und schreib auf, was mit muss."}</small></span><span class="plusdot">${I.plus}</span></button>`;
    g.innerHTML = html;
  }

  function itemHTML(it){
    return `<div class="item ${it.done ? "done" : ""}" data-item="${it.id}">
      <button class="chk" data-toggle="${it.id}" aria-label="${it.done ? "Haken entfernen" : "Abhaken"}">${I.check}</button>
      <input class="item-in" value="${esc(it.text)}" data-edit="${it.id}" enterkeyhint="done" aria-label="Gegenstand">
      <button class="del" data-del="${it.id}" aria-label="Punkt löschen">${I.x}</button>
    </div>`;
  }
  function renderDetail(){
    const ev = events[view.id];
    const open = ev.items.filter(i => !i.done), done = ev.items.filter(i => i.done);

        <button class="circle gl" data-back aria-label="Zurück">${I.back}</button>
        <label class="datepill gl"><span class="dot"></span><span id="dlabel">${ev.date ? esc(fmtDate(ev.date)) : "Datum wählen"}</span><input type="date" value="${esc(ev.date||"")}" data-date aria-label="Datum"></label>
        <button class="circle gl" data-reset aria-label="Alle Haken entfernen">${I.reset}</button>
      </div>
      <textarea class="title-in" rows="1" placeholder="Was ist das für ein Event?" data-title aria-label="Event-Name">${esc(ev.title)}</textarea>
      <div class="prog">
        <span class="circle gl" id="pp"></span>
        <span class="wave gl" id="wave">${Array.from({length:28},(_,k)=>`<i style="height:${6 + Math.round(Math.abs(Math.sin(k*1.7)*14 + Math.sin(k*.6)*8))}px"></i>`).join("")}<b id="pr"></b></span>
      </div>

        ${done.length ? `<div class="sub faint">Eingepackt · ${done.length}</div>${done.map(itemHTML).join("")}` : ""}
      </section>
      <div class="actions">
        <button class="chip gl" data-dup>Als Vorlage kopieren</button>
        <button class="chip gl danger" data-remove>Event löschen</button>
      </div>`;
    dock.innerHTML = `<form class="adder" id="adder" autocomplete="off">
      <input id="new-item" class="gl" placeholder="Was muss noch mit?" enterkeyhint="enter" aria-label="Neuer Punkt">
      <button type="submit" aria-label="Hinzufügen">${I.plus}</button>
    </form>`;
    autosize($("[data-title]"));
    updateProgress();
    setSync();
  }
  function updateProgress(){
    const ev = events[view.id]; if (!ev) return;
    const s = stats(ev);
    const pp = $("#pp"), pr = $("#pr"), pm = $("#pm");
    if (pp) pp.textContent = s.pct + " %";
    if (pr) pr.textContent = s.n ? `${s.d}/${s.n}` : "–";
    if (pm) pm.textContent = s.n ? (s.d === s.n ? "Alles eingepackt – viel Spaß!" : `${s.d} von ${s.n} eingepackt`) : "Noch nichts auf der Liste";
    document.querySelectorAll("#wave i").forEach((el, k, all) => el.classList.toggle("on", s.n > 0 && (k + .5) / all.length * 100 <= s.pct));
  }
  function autosize(el){ if (!el) return; el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

  // ---------- actions ----------
  function createEvent(){
    const id = uid();
    const imgs = Object.values(events).map(e => e.img ?? 0);
    events[id] = { title:"", date:"", items:[], img: imgs.length % CARDS.length, createdAt:Date.now(), updatedAt:Date.now() };
    touch(id); query = ""; view = { name:"detail", id }; render(); scrollTo(0,0);
    setTimeout(() => { const a = document.activeElement; if (!a || a === document.body) $("[data-title]")?.focus(); }, 60);
  }
  function addItem(text){
    const ev = events[view.id]; text = text.trim(); if (!ev || !text) return;
    ev.items.push({ id: uid(), text, done:false }); touch(view.id);
    const hint = $(".hint"); if (hint) hint.remove();
    $("#open").insertAdjacentHTML("beforeend", itemHTML(ev.items[ev.items.length-1]));
    updateProgress();
  }
  function toggleItem(itemId){
    const ev = events[view.id]; const it = ev?.items.find(i => i.id === itemId); if (!it) return;
    it.done = !it.done; touch(view.id);
    app.querySelector(`[data-item="${itemId}"]`)?.classList.toggle("done", it.done);
    updateProgress();
    clearTimeout(toggleItem._t);
    toggleItem._t = setTimeout(() => { if (view.name === "detail" && !(document.activeElement && document.activeElement.id === "new-item")) { const y = scrollY; renderDetail(); scrollTo(0, y); } }, 650);
    const s = stats(ev); if (it.done && s.n && s.d === s.n) toast("Alles eingepackt – viel Spaß!");
  }
  function deleteItem(itemId){
    const ev = events[view.id]; if (!ev) return;
    const i = ev.items.findIndex(x => x.id === itemId); if (i < 0) return;
    ev.items.splice(i, 1); touch(view.id);
    app.querySelector(`[data-item="${itemId}"]`)?.remove(); updateProgress();
  }
  function goList(){
    const ev = events[view.id];
    if (ev && !ev.title.trim() && !ev.items.length) { delete events[view.id]; saveLocal(); removeRemote(view.id); }
    view = { name:"list", id:null }; render(); scrollTo(0,0);
  }
  function modal(html){ $("#modal").innerHTML = html; $("#scrim").classList.add("on"); }
  function closeModal(){ $("#scrim").classList.remove("on"); }

  // ---------- wiring ----------
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-open],[data-new],[data-back],[data-toggle],[data-del],[data-reset],[data-dup],[data-remove]");
    if (!t || t.closest("#scrim")) return;
    if (t.dataset.open){ view = { name:"detail", id:t.dataset.open }; render(); scrollTo(0,0); }
    else if (t.hasAttribute("data-new")) createEvent();
    else if (t.hasAttribute("data-back")) goList();
    else if (t.dataset.toggle) toggleItem(t.dataset.toggle);
    else if (t.dataset.del) deleteItem(t.dataset.del);
    else if (t.hasAttribute("data-reset")){
      const ev = events[view.id]; if (!ev.items.some(i => i.done)) return toast("Noch nichts abgehakt");
      ev.items.forEach(i => i.done = false); touch(view.id); renderDetail(); toast("Alle Haken entfernt");
    }
    else if (t.hasAttribute("data-dup")){
      const ev = events[view.id], id = uid();
      events[id] = { title:(ev.title || "Event") + " (Kopie)", date:"", img:((ev.img ?? 0) + 1) % CARDS.length, items: ev.items.map(i => ({ id:uid(), text:i.text, done:false })), createdAt:Date.now(), updatedAt:Date.now() };
      touch(id); view = { name:"detail", id }; render(); scrollTo(0,0); toast("Kopie angelegt");
    }
    else if (t.hasAttribute("data-remove")){
      const ev = events[view.id];
      modal(`<h3>Event löschen?</h3><p>„${esc(ev.title || "Unbenanntes Event")}“ und alle ${ev.items.length} Punkte werden entfernt.</p>
        <div class="btns"><button class="b-ghost" data-m="no">Abbrechen</button><button class="b-warn" data-m="yes">Löschen</button></div>`);
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "q"){ query = e.target.value; renderGrid(); return; }
    const ev = events[view.id]; if (!ev) return;
    if (e.target.matches("[data-title]")){ ev.title = e.target.value; autosize(e.target); touch(view.id); }
    else if (e.target.matches("[data-date]")){ ev.date = e.target.value; $("#dlabel").textContent = ev.date ? fmtDate(ev.date) : "Datum wählen"; touch(view.id); }
    else if (e.target.dataset.edit){ const it = ev.items.find(i => i.id === e.target.dataset.edit); if (it){ it.text = e.target.value; touch(view.id); } }
  });
  document.addEventListener("keydown", e => {
    if (e.target.matches?.("[data-title]") && e.key === "Enter"){ e.preventDefault(); $("#new-item")?.focus(); }
    if (e.target.dataset?.edit && e.key === "Enter"){ e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener("focusout", e => { if (e.target.dataset?.edit && !e.target.value.trim()) deleteItem(e.target.dataset.edit); });
  document.addEventListener("submit", e => {
    if (e.target.id !== "adder") return;
    e.preventDefault(); const inp = $("#new-item"); addItem(inp.value); inp.value = ""; inp.focus();
  });
  $("#scrim").addEventListener("click", e => {
    if (e.target.id === "scrim") return closeModal();
    const b = e.target.closest("[data-m]"); if (!b) return;
    if (b.dataset.m === "yes"){ const id = view.id; delete events[id]; saveLocal(); removeRemote(id); closeModal(); view = { name:"list", id:null }; render(); toast("Event gelöscht"); }
    else closeModal();
  });

  loadLocal(); render(); connect();
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e) {}
  }
})();
</script>
</body>
</html>
